name: Build & Push OpenSnell Docker Image

on:
  push:
    branches:
      - main
    paths:
      - 'docker/opensnell/**'
      - '.github/workflows/build-opensnell.yml'
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:
    inputs:
      opensnell_version:
        description: 'OpenSnell version tag (e.g. v1.0.2)'
        required: false
        default: ''
        type: string

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Determine OpenSnell version
        id: version
        run: |
          # Save the release payload so the fingerprint step can use it; a
          # manual dispatch may pin any tag/branch ref.
          if [ -n "${{ inputs.opensnell_version }}" ]; then
            VER="${{ inputs.opensnell_version }}"
          else
            RELEASE_JSON=$(curl -fsSL "https://api.github.com/repos/missuo/opensnell/releases/latest" 2>/dev/null || true)
            printf '%s' "$RELEASE_JSON" > "$RUNNER_TEMP/release.json"
            VER=$(printf '%s' "$RELEASE_JSON" \
              | sed -nE 's/.*"tag_name"[[:space:]]*:[[:space:]]*"([^"]+)".*/\1/p' | head -1)
            if [ -z "$VER" ]; then
              echo "::warning::Failed to fetch latest OpenSnell version, falling back to v1.0.2"
              VER="v1.0.2"
            fi
          fi
          echo "opensnell_version=$VER" >> $GITHUB_OUTPUT

      - name: Compute source fingerprint
        id: fingerprint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # OpenSnell is built from source, so fingerprint the resolved git
          # commit of the ref plus the version string baked into the binary.
          # A retagged / force-pushed release yields a new commit -> rebuild;
          # an unchanged ref is skipped.
          VER="${{ steps.version.outputs.opensnell_version }}"
          COMMIT=$(gh api "repos/missuo/opensnell/commits/${VER}" --jq .sha 2>/dev/null || true)
          # gh api prints its error JSON to stdout on failure, so validate shape.
          if ! printf '%s' "$COMMIT" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::warning::Could not resolve commit for ${VER}, fingerprinting by version only"
            COMMIT="unresolved"
          fi

          SHA=$(printf 'version=%s\ncommit=%s\n' "$VER" "$COMMIT" | sha256sum | awk '{print $1}')
          echo "source_sha=${SHA}" >> $GITHUB_OUTPUT
          echo "source fingerprint: version=${VER} commit=${COMMIT} -> ${SHA}"

      - name: Check if source already published
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # only skip on schedule; push/workflow_dispatch always build
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "skip=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          SRC="${{ steps.fingerprint.outputs.source_sha }}"
          OWNER="${{ github.repository_owner }}"
          COMP="opensnell-server"
          TAG="src-${SRC}"

          # Ask the GHCR registry directly for the tag list — robust to whether
          # the package owner is a user or an org (the packages REST API needs
          # /users vs /orgs and correct scopes).
          TOKEN=$(curl -fsSL -u "${GITHUB_ACTOR}:${GH_TOKEN}" \
            "https://ghcr.io/token?service=ghcr.io&scope=repository:${OWNER}/${COMP}:pull" \
            2>/dev/null | jq -r .token 2>/dev/null || true)

          EXISTS=""
          if [ -n "$TOKEN" ] && [ "$TOKEN" != "null" ]; then
            EXISTS=$(curl -fsSL -H "Authorization: Bearer ${TOKEN}" \
              "https://ghcr.io/v2/${OWNER}/${COMP}/tags/list" 2>/dev/null \
              | jq -r '.tags[]?' 2>/dev/null | grep -Fx "${TAG}" || true)
          fi

          if [ -n "$EXISTS" ]; then
            echo "Source ${SRC} already published as ${COMP}:${TAG}, skipping."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "Source ${SRC} not published for ${COMP}, building..."
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up QEMU
        if: steps.check.outputs.skip != 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.check.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        if: steps.check.outputs.skip != 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        if: steps.check.outputs.skip != 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/opensnell-server
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.version.outputs.opensnell_version }}
            type=raw,value=src-${{ steps.fingerprint.outputs.source_sha }}

      - name: Build and push
        if: steps.check.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: docker/opensnell
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          build-args: |
            OPENSNELL_VERSION=${{ steps.version.outputs.opensnell_version }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opensnell.source-sha=${{ steps.fingerprint.outputs.source_sha }}
          tags: ${{ steps.meta.outputs.tags }}
          push: true
          provenance: false
