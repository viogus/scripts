name: Build & Push TimescaleDB Docker Image

# Self-built full TimescaleDB (Apache + TSL: compression/retention) on Tiny Core
# Linux. Official timescale/timescaledb is glibc/Debian only (~1 GB); Alpine
# community package is -DAPACHE_ONLY (no compression/retention). This builds the
# upstream default (TSL included) and publishes to ghcr.io.
#
# 架构：至少 linux/amd64 + linux/arm64（都是硬要求），每个平台在**原生 runner**
# 上构建——arm64 不用 QEMU，速度快一个数量级，也不会碰到 QEMU 下 gcc 随机段错误。
# 两个平台各自 push-by-digest，再**在同一个原生 runner 上把这个 digest 拉下来跑冒烟**
# （起库 -> CREATE EXTENSION timescaledb -> hypertable -> 插查），冒烟过了才上传 digest，
# 最后由 merge job 用 imagetools 合成一个 manifest。
# 其它架构（32 位、riscv64 等）Tiny Core 没有 rootfs，见 docker/timescaledb/README.md
# 「架构支持」：本地用 ./build.sh alpine-lean <arch> 走 musl 路线。

on:
  push:
    branches:
      - main
    paths:
      - 'docker/timescaledb/**'
      - '.github/workflows/build-timescaledb.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository_owner }}/timescaledb

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: docker/timescaledb
          file: docker/timescaledb/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      # 在这个平台的**原生** runner 上把刚推上去的镜像拉回来跑一遍端到端冒烟，
      # 失败就不上传 digest（=> merge job 拿不到该平台，不会发布坏镜像）。
      - name: Smoke test the pushed image
        run: |
          image="${REGISTRY}/${IMAGE}@${{ steps.build.outputs.digest }}"
          docker pull "$image"
          docker tag "$image" "ts-smoke:${{ matrix.arch }}"
          sh docker/timescaledb/smoke-timescaledb.sh "ts-smoke:${{ matrix.arch }}" "ts-smoke-${{ matrix.arch }}"

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            --tag "${REGISTRY}/${IMAGE}:latest-pg18" \
            --tag "${REGISTRY}/${IMAGE}:2.30.0-pg18" \
            $(printf "${REGISTRY}/${IMAGE}@sha256:%s " *)

      - name: Inspect manifest
        run: docker buildx imagetools inspect "${REGISTRY}/${IMAGE}:2.30.0-pg18"
