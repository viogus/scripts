name: Build & Push TimescaleDB Docker Image

# Self-built full TimescaleDB (Apache + TSL: compression/retention) on Alpine.
# Official timescale/timescaledb is glibc/Debian only (~1 GB); Alpine community
# package is -DAPACHE_ONLY (no compression/retention). This builds the upstream
# default (TSL included) against postgres:18-alpine and publishes to ghcr.io.

on:
  push:
    branches:
      - main
    paths:
      - 'docker/timescaledb/**'
      - '.github/workflows/build-timescaledb.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: docker/timescaledb
          file: docker/timescaledb/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/timescaledb:latest-pg18
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/timescaledb:2.30.0-pg18
