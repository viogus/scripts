name: Build & Push Home Assistant (Alpine) Docker Image

# 自建 kurapov/alpine-homeassistant 的替代镜像，推到 ghcr.io（Docker Hub 现在
# 到处被限流，自己的 registry 拉起来才稳）。
#   Dockerfile : docker/homeassistant/Dockerfile（紧跟上游，只把 jemalloc 换成 apk 包）
#   HA 版本    : 默认取 PyPI 上最新的正式版；也可以在 workflow_dispatch 里指定
#   Xiaomi Home: 预装小米官方集成，默认取 XiaoMi/ha_xiaomi_home 最新 release
#   架构       : linux/amd64 + linux/arm64，各自在**原生** runner 上构建
#                （ubuntu-24.04 / ubuntu-24.04-arm），再用 imagetools 合成一个
#                multi-arch manifest —— 之前 arm64 走 QEMU，光编译就要十几分钟。
#   跳过       : ghcr 上已有同名 tag，且镜像 label 里的 Xiaomi Home 版本与构建
#                指纹都与本次一致，才跳过。
#
# 分层：resolve（版本）→ matrix（哪些变体）→ build（变体 × 架构，按 digest 推）
#      → merge（合成多架构 tag）→ smoke（真跑一遍）

on:
  push:
    branches:
      - main
    paths:
      - 'docker/homeassistant/**'
      - '.github/workflows/build-homeassistant.yml'
  schedule:
    - cron: '41 2 * * 1'
  workflow_dispatch:
    inputs:
      ha_version:
        description: 'Home Assistant version (e.g. 2026.10.4). Empty = latest stable on PyPI'
        required: false
        default: ''
        type: string
      xiaomi_home_version:
        description: 'Xiaomi Home integration tag (e.g. v0.5.0). Empty = latest release on GitHub'
        required: false
        default: ''
        type: string
      force:
        description: 'Rebuild even when the image tag already exists'
        required: false
        default: false
        type: boolean
      variants:
        description: 'Comma separated subset to build (e.g. nano). Empty = all four'
        required: false
        default: ''
        type: string

# 同一时间只跑一份：两次构建同时推同名 tag 会互相覆盖 manifest。
concurrency:
  group: build-homeassistant
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository_owner }}/homeassistant

jobs:
  resolve:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      minor: ${{ steps.v.outputs.minor }}
      build_date: ${{ steps.v.outputs.build_date }}
      xiaomi_home: ${{ steps.v.outputs.xiaomi_home }}
      dockerfile_sha: ${{ steps.v.outputs.dockerfile_sha }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve Home Assistant version
        id: v
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          V='${{ inputs.ha_version }}'
          if [ -z "$V" ]; then
            # info.version 可能是 beta（2026.11.0b0），所以从 releases 里挑最高的正式版
            # 取不到就交给下面的 WARN 分支兜底，不要整条流水线挂掉
            V=$(curl -fsS --retry 3 https://pypi.org/pypi/homeassistant/json \
              | jq -r '.releases | keys[]' \
              | grep -E '^[0-9]{4}\.[0-9]{1,2}\.[0-9]+$' \
              | sort -V | tail -1 || true)
          fi
          if ! printf '%s' "$V" | grep -Eq '^[0-9]{4}\.[0-9]{1,2}\.[0-9]+$'; then
            echo "WARN: cannot resolve a sane Home Assistant version (got '$V'), falling back to 2026.10.4" >&2
            V=2026.10.4
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "minor=${V%.*}" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "Home Assistant $V"

          # Xiaomi Home 集成（custom_components，不在 PyPI 上，只能跟 GitHub release）
          XM='${{ inputs.xiaomi_home_version }}'
          if [ -z "$XM" ]; then
            # 不用 .tag_name 直接信：release 可能是 draft/prerelease，这里只认正式 tag
            # 匿名调 GitHub API 会被共享 runner 的 IP 打到 403；带上 token，
            # 再退一步也允许失败，让 version 回落到 Dockerfile 里的默认值。
            XM=$(curl -fsS --retry 3 \
              -H "Authorization: Bearer ${GITHUB_TOKEN:-}" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/XiaoMi/ha_xiaomi_home/releases/latest \
              | jq -r '.tag_name // ""' || true)
          fi
          if ! printf '%s' "$XM" | grep -Eq '^v?[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "WARN: cannot resolve a sane Xiaomi Home version (got '$XM'), falling back to v0.5.0" >&2
            XM=v0.5.0
          fi
          # 统一成上游的 tag 形式（v0.5.0），Dockerfile 直接拼在 tarball URL 里
          XM="v${XM#v}"
          echo "xiaomi_home=$XM" >> "$GITHUB_OUTPUT"
          echo "Xiaomi Home $XM"

          # 构建脚本指纹：只比 HA/集成版本的话，改了 Dockerfile、entrypoint、nano 的
          # 种子/裁剪脚本或本 workflow 也会被“tag 已存在”跳过，修改永远发不出去。
          # （踩过：只改了 nano-seeds.txt，check 判定 sha 没变 → 整个 build 被跳过，
          #  smoke 拉到的还是旧镜像。）
          SHA=$(cat docker/homeassistant/Dockerfile docker/homeassistant/docker-entrypoint.sh \
            docker/homeassistant/nano-seeds.txt docker/homeassistant/prune-components.py \
            docker/homeassistant/configuration.slim.yaml \
            .github/workflows/build-homeassistant.yml | sha256sum | cut -c1-16)
          echo "dockerfile_sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "build fingerprint $SHA"

  # 调一个变体做迭代时不必等另外三个
  matrix:
    runs-on: ubuntu-24.04
    outputs:
      variants: ${{ steps.m.outputs.variants }}
    steps:
      - id: m
        run: |
          set -euo pipefail
          V='${{ inputs.variants }}'
          [ -n "$V" ] || V='full,slim,micro,nano'
          JSON=$(printf '%s' "$V" | tr ',' '\n' | sed '/^[[:space:]]*$/d' | jq -R . | jq -sc .)
          echo "variants=$JSON" >> "$GITHUB_OUTPUT"
          echo "building: $JSON"

  build:
    needs: [resolve, matrix]
    # arm64 跑在原生 arm runner 上，不再过 QEMU
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        # full = 装齐 default_config 依赖；slim = 只装始终加载的那批 + 小米集成
        variant: ${{ fromJson(needs.matrix.outputs.variants) }}
        arch: [amd64, arm64]
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      # 默认的 docker driver 不支持导出 registry 缓存（"Cache export is not
      # supported for the docker driver"），换成 docker-container driver 才有
      # cache-to / cache-from，也才能 push-by-digest。
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if version already published
        id: check
        env:
          VARIANT: ${{ matrix.variant }}
          VERSION: ${{ needs.resolve.outputs.version }}
          WANT_XM: ${{ needs.resolve.outputs.xiaomi_home }}
          WANT_SHA: ${{ needs.resolve.outputs.dockerfile_sha }}
        run: |
          set -euo pipefail
          if [ '${{ inputs.force }}' = 'true' ]; then
            echo "manual dispatch with force, rebuilding"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TAG="${REGISTRY}/${IMAGE}:${VERSION}"
          [ "$VARIANT" = "full" ] || TAG="${TAG}-${VARIANT}"
          if ! docker buildx imagetools inspect "$TAG" >/dev/null 2>&1; then
            echo "$TAG not found, building"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          AMD=$(docker buildx imagetools inspect "$TAG" --raw \
            | jq -r '.manifests[] | select(.platform.architecture=="amd64") | .digest' \
            | head -1)
          HAVE_XM=$(docker buildx imagetools inspect "$TAG@$AMD" \
            --format '{{index .Image.Config.Labels "org.opencontainers.image.xiaomi_home.version"}}' \
            2>/dev/null || true)
          HAVE_SHA=$(docker buildx imagetools inspect "$TAG@$AMD" \
            --format '{{index .Image.Config.Labels "org.opencontainers.image.homeassistant.dockerfile-sha"}}' \
            2>/dev/null || true)
          if [ "$HAVE_XM" = "$WANT_XM" ] && [ "$HAVE_SHA" = "$WANT_SHA" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "$TAG already has xiaomi $WANT_XM / sha $WANT_SHA, skipping"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "$TAG differs (xiaomi $HAVE_XM vs $WANT_XM, sha $HAVE_SHA vs $WANT_SHA), rebuilding"
          fi

      - name: Build ${{ matrix.variant }} for linux/${{ matrix.arch }}
        if: steps.check.outputs.skip != 'true'
        id: build
        uses: docker/build-push-action@v7
        with:
          context: docker/homeassistant
          file: docker/homeassistant/Dockerfile
          platforms: linux/${{ matrix.arch }}
          build-args: |
            VERSION=${{ needs.resolve.outputs.version }}
            BUILD_DATE=${{ needs.resolve.outputs.build_date }}
            COMMIT=${{ github.sha }}
            XIAOMI_HOME_VERSION=${{ needs.resolve.outputs.xiaomi_home }}
            DOCKERFILE_SHA=${{ needs.resolve.outputs.dockerfile_sha }}
            VARIANT=${{ matrix.variant }}
            TRIM_ASSETS=${{ (matrix.variant == 'micro' || matrix.variant == 'nano') && '1' || '0' }}
            TRIM_COMPONENTS=${{ matrix.variant == 'nano' && '1' || '0' }}
          # 只按 digest 推，tag 留给 merge 那步统一打，这样两个架构不会互相覆盖。
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: false
          # 缓存按架构分开存，两边指令不同，混用会互相失效。
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE }}:buildcache-${{ matrix.variant }}-${{ matrix.arch }}
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE }}:buildcache-${{ matrix.variant }}-${{ matrix.arch }},mode=max

      - name: Export digest
        if: steps.check.outputs.skip != 'true'
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          digest='${{ steps.build.outputs.digest }}'
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        if: steps.check.outputs.skip != 'true'
        uses: actions/upload-artifact@v5
        with:
          name: digest-${{ matrix.variant }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: [resolve, matrix, build]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJson(needs.matrix.outputs.variants) }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v5
        continue-on-error: true
        with:
          pattern: digest-${{ matrix.variant }}-*
          path: /tmp/digests
          merge-multiple: true

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest
        id: merge
        env:
          VARIANT: ${{ matrix.variant }}
          VERSION: ${{ needs.resolve.outputs.version }}
          MINOR: ${{ needs.resolve.outputs.minor }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          FILES=(/tmp/digests/*)
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "no digests for $VARIANT — build was skipped"
            echo "merged=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          SOURCES=()
          for f in "${FILES[@]}"; do
            SOURCES+=("${REGISTRY}/${IMAGE}@sha256:$(basename "$f")")
          done
          TAGS=()
          if [ "$VARIANT" = "full" ]; then
            TAGS+=("${REGISTRY}/${IMAGE}:${VERSION}" "${REGISTRY}/${IMAGE}:${MINOR}" "${REGISTRY}/${IMAGE}:latest")
          else
            TAGS+=("${REGISTRY}/${IMAGE}:${VERSION}-${VARIANT}" "${REGISTRY}/${IMAGE}:${VARIANT}")
          fi
          echo "sources: ${SOURCES[*]}"
          echo "tags: ${TAGS[*]}"
          ARGS=()
          for t in "${TAGS[@]}"; do ARGS+=("-t" "$t"); done
          docker buildx imagetools create "${ARGS[@]}" "${SOURCES[@]}"
          echo "merged=true" >> "$GITHUB_OUTPUT"

      - name: Inspect merged manifest
        if: steps.merge.outputs.merged == 'true'
        run: |
          set -euo pipefail
          TAG="${REGISTRY}/${IMAGE}:${{ needs.resolve.outputs.version }}"
          [ "${{ matrix.variant }}" = "full" ] || TAG="${TAG}-${{ matrix.variant }}"
          docker buildx imagetools inspect "$TAG"

  # 推完立刻在原生 amd64 上把镜像跑起来。除了 /manifest.json 返回 200，还要
  # 确认 Xiaomi Home 集成真的加载得起来（播种、依赖、config flow 三步），
  # 详见 docker/homeassistant/smoke-test.sh。
  smoke:
    needs: [resolve, matrix, merge]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJson(needs.matrix.outputs.variants) }}
    steps:
      - uses: actions/checkout@v7

      - name: Smoke test the published image
        env:
          XM_VERSION: ${{ needs.resolve.outputs.xiaomi_home }}
          VARIANT: ${{ matrix.variant }}
          SMOKE_SLIM: ${{ matrix.variant != 'full' && '1' || '0' }}
          SMOKE_MICRO: ${{ (matrix.variant == 'micro' || matrix.variant == 'nano') && '1' || '0' }}
          SMOKE_NANO: ${{ matrix.variant == 'nano' && '1' || '0' }}
        run: |
          set -euo pipefail
          IMG="${REGISTRY}/${IMAGE}:${{ needs.resolve.outputs.version }}"
          [ "$VARIANT" = "full" ] || IMG="${IMG}-${VARIANT}"
          docker pull "$IMG"
          bash docker/homeassistant/smoke-test.sh "$IMG" "$XM_VERSION"

      - name: Summary
        run: |
          set -euo pipefail
          V='${{ matrix.variant }}'
          case "$V" in
            full)  DESC="full：default_config 依赖齐全。" ;;
            slim)  DESC="slim：不含 default_config 那批依赖，首启会种一份精简 configuration.yaml。" ;;
            micro) DESC="micro：slim + 只留 en/zh-Hans 翻译、去掉 frontend_es5 / sourcemap / 无用 stdlib。" ;;
            nano)  DESC="nano：micro + 只保留小米 / HomeKit 实际用到的集成（nano-seeds.txt，机器可读清单）。" ;;
          esac
          [ "$V" = "full" ] && SUFFIX="" || SUFFIX="-$V"
          VERSIONED="${REGISTRY}/${IMAGE}:${{ needs.resolve.outputs.version }}${SUFFIX}"
          {
            echo "### Home Assistant ${{ needs.resolve.outputs.version }}（$V）"
            echo
            echo "Xiaomi Home：\`${{ needs.resolve.outputs.xiaomi_home }}\`　构建指纹：\`${{ needs.resolve.outputs.dockerfile_sha }}\`"
            echo
            echo '```'
            echo "docker pull ${VERSIONED}"
            echo "docker pull ${REGISTRY}/${IMAGE}:${V}"
            echo '```'
            echo
            echo "$DESC"
            echo
            echo "平台：linux/amd64, linux/arm64（各自原生构建，imagetools 合成 manifest）"
          } >> "$GITHUB_STEP_SUMMARY"
