name: Build & Push Home Assistant (Alpine) Docker Image

# 自建 kurapov/alpine-homeassistant 的替代镜像，推到 ghcr.io（Docker Hub 现在
# 到处被限流，自己的 registry 拉起来才稳）。
#   Dockerfile : docker/homeassistant/Dockerfile（紧跟上游，只把 jemalloc 换成 apk 包）
#   HA 版本    : 默认取 PyPI 上最新的正式版；也可以在 workflow_dispatch 里指定
#   Xiaomi Home: 预装小米官方集成，默认取 XiaoMi/ha_xiaomi_home 最新 release
#   架构       : linux/amd64, linux/arm64（arm64 在 amd64 runner 上走 QEMU；armv7 已丢弃）
#   跳过       : ghcr 上已有同名 tag，且镜像 label 里的 Xiaomi Home 版本与本次解析
#                出来的一致，才跳过 —— 只比 tag 会漏掉“HA 没动但小米集成发新版”
#                的情况。
#
# 一次三架构构建实测 ~75 分钟（上游同样配置：2026.10.4，05:03 -> 06:16 UTC）。

on:
  push:
    branches:
      - main
    paths:
      - 'docker/homeassistant/**'
      - '.github/workflows/build-homeassistant.yml'
  schedule:
    - cron: '41 2 * * 1'
  workflow_dispatch:
    inputs:
      ha_version:
        description: 'Home Assistant version (e.g. 2026.10.4). Empty = latest stable on PyPI'
        required: false
        default: ''
        type: string
      xiaomi_home_version:
        description: 'Xiaomi Home integration tag (e.g. v0.5.0). Empty = latest release on GitHub'
        required: false
        default: ''
        type: string
      force:
        description: 'Rebuild even when the image tag already exists'
        required: false
        default: false
        type: boolean

# 同一时间只跑一份：两次构建同时推同名 tag 会互相覆盖 manifest。
concurrency:
  group: build-homeassistant
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository_owner }}/homeassistant

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        # full = 装齐 default_config 依赖；slim = 只装始终加载的那批 + 小米集成
        variant: [full, slim, micro]
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Resolve Home Assistant version
        id: v
        run: |
          set -euo pipefail
          V='${{ inputs.ha_version }}'
          if [ -z "$V" ]; then
            # info.version 可能是 beta（2026.11.0b0），所以从 releases 里挑最高的正式版
            V=$(curl -fsS https://pypi.org/pypi/homeassistant/json \
              | jq -r '.releases | keys[]' \
              | grep -E '^[0-9]{4}\.[0-9]{1,2}\.[0-9]+$' \
              | sort -V | tail -1)
          fi
          if ! printf '%s' "$V" | grep -Eq '^[0-9]{4}\.[0-9]{1,2}\.[0-9]+$'; then
            echo "WARN: cannot resolve a sane Home Assistant version (got '$V'), falling back to 2026.10.4" >&2
            V=2026.10.4
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "minor=${V%.*}" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "Home Assistant $V"

          # Xiaomi Home 集成（custom_components，不在 PyPI 上，只能跟 GitHub release）
          XM='${{ inputs.xiaomi_home_version }}'
          if [ -z "$XM" ]; then
            # 不用 .tag_name 直接信：release 可能是 draft/prerelease，这里只认正式 tag
            XM=$(curl -fsS https://api.github.com/repos/XiaoMi/ha_xiaomi_home/releases/latest \
              | jq -r '.tag_name // ""')
          fi
          if ! printf '%s' "$XM" | grep -Eq '^v?[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "WARN: cannot resolve a sane Xiaomi Home version (got '$XM'), falling back to v0.5.0" >&2
            XM=v0.5.0
          fi
          # 统一成上游的 tag 形式（v0.5.0），Dockerfile 直接拼在 tarball URL 里
          XM="v${XM#v}"
          echo "xiaomi_home=${XM}" >> "$GITHUB_OUTPUT"
          echo "Xiaomi Home $XM"

          # 构建脚本指纹：只比 HA/集成版本的话，改了 Dockerfile、entrypoint 或本
          # workflow 也会被“tag 已存在”跳过，修改永远发不出去。
          SHA=$(cat docker/homeassistant/Dockerfile docker/homeassistant/docker-entrypoint.sh \
            .github/workflows/build-homeassistant.yml | sha256sum | cut -c1-16)
          echo "dockerfile_sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "build fingerprint $SHA"

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if version already published
        id: check
        run: |
          set -euo pipefail
          if [ '${{ inputs.force }}' = 'true' ]; then
            echo "manual dispatch with force, rebuilding"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TAG="${REGISTRY}/${IMAGE}:${{ steps.v.outputs.version }}"
          case '${{ matrix.variant }}' in
            slim)  TAG="${TAG}-slim" ;;
            micro) TAG="${TAG}-micro" ;;
          esac
          WANT_XM='${{ steps.v.outputs.xiaomi_home }}'
          WANT_SHA='${{ steps.v.outputs.dockerfile_sha }}'
          if ! docker buildx imagetools inspect "$TAG" >/dev/null 2>&1; then
            echo "$TAG not found, building"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # tag 在就去比 label 里的小米集成版本：HA 没发新版、但上游集成发了，
          # 也应该重建。label 缺失（老镜像）同样按“需要重建”处理。
          AMD=$(docker buildx imagetools inspect "$TAG" --raw \
            | jq -r '.manifests[] | select(.platform.architecture=="amd64") | .digest' \
            | head -1)
          HAVE_XM=$(docker buildx imagetools inspect "$TAG@$AMD" \
            --format '{{index .Image.Config.Labels "org.opencontainers.image.xiaomi_home.version"}}' \
            2>/dev/null || true)
          HAVE_SHA=$(docker buildx imagetools inspect "$TAG@$AMD" \
            --format '{{index .Image.Config.Labels "org.opencontainers.image.homeassistant.dockerfile-sha"}}' \
            2>/dev/null || true)
          if [ "$HAVE_XM" = "$WANT_XM" ] && [ "$HAVE_SHA" = "$WANT_SHA" ]; then
            echo "$TAG already ships Xiaomi Home $HAVE_XM (build $HAVE_SHA), skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "$TAG has Xiaomi Home '${HAVE_XM:-<none>}' build '${HAVE_SHA:-<none>}'," \
                 "wanted '$WANT_XM' build '$WANT_SHA' -> rebuilding"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU
        if: steps.check.outputs.skip != 'true'
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        if: steps.check.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v4

      - name: Extract metadata
        if: steps.check.outputs.skip != 'true'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable=${{ matrix.variant == 'full' }}
            type=raw,value=${{ steps.v.outputs.version }},enable=${{ matrix.variant == 'full' }}
            type=raw,value=${{ steps.v.outputs.minor }},enable=${{ matrix.variant == 'full' }}
            type=raw,value=${{ steps.v.outputs.version }}-slim,enable=${{ matrix.variant == 'slim' }}
            type=raw,value=slim,enable=${{ matrix.variant == 'slim' }}
            type=raw,value=${{ steps.v.outputs.version }}-micro,enable=${{ matrix.variant == 'micro' }}
            type=raw,value=micro,enable=${{ matrix.variant == 'micro' }}

      - name: Build and push
        if: steps.check.outputs.skip != 'true'
        id: build
        uses: docker/build-push-action@v7
        with:
          context: docker/homeassistant
          file: docker/homeassistant/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ steps.v.outputs.version }}
            BUILD_DATE=${{ steps.v.outputs.build_date }}
            COMMIT=${{ github.sha }}
            XIAOMI_HOME_VERSION=${{ steps.v.outputs.xiaomi_home }}
            DOCKERFILE_SHA=${{ steps.v.outputs.dockerfile_sha }}
            VARIANT=${{ matrix.variant }}
            TRIM_ASSETS=${{ matrix.variant == 'micro' && '1' || '0' }}
          # 不传 labels: — 镜像描述走 Dockerfile 里的 OCI LABEL，metadata-action
          # 自动生成的会写成 title=scripts / version=latest，反而更糟。
          tags: ${{ steps.meta.outputs.tags }}
          push: true
          provenance: false
          cache-from: type=gha,scope=homeassistant-${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=homeassistant-${{ matrix.variant }}

      # 推完立刻在原生 amd64 上把镜像跑起来。除了 /manifest.json 返回 200，还要
      # 确认 Xiaomi Home 集成真的加载得起来（播种、依赖、config flow 三步），
      # 详见 docker/homeassistant/smoke-test.sh。
      - name: Smoke test the published image
        if: steps.check.outputs.skip != 'true'
        env:
          XM_VERSION: ${{ steps.v.outputs.xiaomi_home }}
          SMOKE_SLIM: ${{ matrix.variant != 'full' && '1' || '0' }}
          SMOKE_MICRO: ${{ matrix.variant == 'micro' && '1' || '0' }}
        run: |
          set -euo pipefail
          IMG="${REGISTRY}/${IMAGE}:${{ steps.v.outputs.version }}"
          case '${{ matrix.variant }}' in
            slim)  IMG="${IMG}-slim" ;;
            micro) IMG="${IMG}-micro" ;;
          esac
          docker pull "$IMG"
          bash docker/homeassistant/smoke-test.sh "$IMG" "$XM_VERSION"

      - name: Summary
        run: |
          {
            echo "### Home Assistant ${{ steps.v.outputs.version }}"
            echo
            echo "变体：\`${{ matrix.variant }}\`　Xiaomi Home：\`${{ steps.v.outputs.xiaomi_home }}\`"
            echo
            if [ '${{ steps.check.outputs.skip }}' = 'true' ]; then
              echo "已存在同名 tag、集成版本与构建指纹一致，跳过：\`${REGISTRY}/${IMAGE}:${{ steps.v.outputs.version }}$([ '${{ matrix.variant }}' = 'slim' ] && echo '-slim')\`"
            else
              echo "已推送："
              echo
              echo '```'
              echo "docker pull ${REGISTRY}/${IMAGE}:${{ steps.v.outputs.version }}$([ '${{ matrix.variant }}' = 'slim' ] && echo '-slim')"
              echo "docker pull ${REGISTRY}/${IMAGE}:$([ '${{ matrix.variant }}' = 'slim' ] && echo 'slim' || echo 'latest')"
              echo '```'
              echo
              if [ '${{ matrix.variant }}' = 'slim' ]; then
                if [ '${{ matrix.variant }}' = 'micro' ]; then
                echo "micro：slim + 只留 en/zh-Hans 翻译、去掉 frontend_es5 / sourcemap / 无用 stdlib。"
              else
                echo "slim：不含 default_config 那批依赖，首启会种一份精简 configuration.yaml。"
              fi
              else
                echo "full：default_config 依赖齐全。"
              fi
              echo
              echo "平台：linux/amd64, linux/arm64"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
