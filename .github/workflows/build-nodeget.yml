name: Build & Push NodeGet Docker Image

on:
  push:
    branches:
      - main
    paths:
      - 'docker/nodeget/**'
      - '.github/workflows/build-nodeget.yml'
  schedule:
    - cron: '7 7 * * *'
  workflow_dispatch:
    inputs:
      nodeget_repo:
        description: 'NodeGet release 来源仓库 (owner/repo)，默认 viogus/NodeGet（含 TimescaleDB）'
        required: false
        default: 'viogus/NodeGet'
        type: string
      nodeget_version:
        description: 'NodeGet version tag (e.g. 0.2.11)'
        required: false
        default: ''
        type: string

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        component:
          - nodeget-server
          - nodeget-agent

    steps:
      - uses: actions/checkout@v4

      - name: Determine NodeGet version
        id: version
        env:
          REPO: ${{ inputs.nodeget_repo || 'viogus/NodeGet' }}
        run: |
          # Fetch the whole release payload so the source fingerprint step can
          # read the per-asset sha256 digests. Manual dispatch may pin a tag.
          if [ -n "${{ inputs.nodeget_version }}" ]; then
            VER="${{ inputs.nodeget_version }}"
            API="https://api.github.com/repos/${REPO}/releases/tags/v${VER}"
          else
            API="https://api.github.com/repos/${REPO}/releases/latest"
          fi

          RELEASE_JSON=$(curl -fsSL "$API" 2>/dev/null || true)
          printf '%s' "$RELEASE_JSON" > "$RUNNER_TEMP/release.json"

          if [ -z "$VER" ]; then
            VER=$(printf '%s' "$RELEASE_JSON" \
              | sed -nE 's/.*"tag_name"[[:space:]]*:[[:space:]]*"v?([^"]+)".*/\1/p' | head -1)
          fi
          if [ -z "$VER" ]; then
            echo "::warning::Failed to fetch latest NodeGet release from ${REPO}, falling back to 0.2.11"
            VER="0.2.11"
          fi
          echo "nodeget_version=$VER" >> $GITHUB_OUTPUT
          echo "nodeget_repo=${REPO}" >> $GITHUB_OUTPUT

      - name: Compute source fingerprint
        id: fingerprint
        run: |
          # Fingerprint the exact release assets this component consumes (incl.
          # the armv7 musl -> gnu fallback). A republished release with the same
          # version but different binaries yields a different fingerprint, so it
          # still rebuilds; identical binaries are skipped.
          COMP="${{ matrix.component }}"
          ASSETS="${COMP}-linux-x86_64-musl ${COMP}-linux-aarch64-musl \
            ${COMP}-linux-armv7-musleabihf ${COMP}-linux-armv7-gnueabihf"

          if [ -s "$RUNNER_TEMP/release.json" ] && jq -e . "$RUNNER_TEMP/release.json" >/dev/null 2>&1; then
            FP=""
            for a in $ASSETS; do
              d=$(jq -r --arg n "$a" \
                '.assets[] | select(.name==$n) | (.digest // ("updated:" + .updated_at))' \
                "$RUNNER_TEMP/release.json" | head -1)
              { [ -n "$d" ] && [ "$d" != "null" ]; } || d="missing"
              FP="${FP}${a}=${d}"$'\n'
            done
            SHA=$(printf '%s' "$FP" | sha256sum | awk '{print $1}')
          else
            echo "::warning::release.json unavailable, fingerprinting by version only"
            SHA=$(printf 'version=%s\n' "${{ steps.version.outputs.nodeget_version }}" | sha256sum | awk '{print $1}')
          fi

          echo "source_sha=${SHA}" >> $GITHUB_OUTPUT
          echo "source fingerprint for ${COMP}: ${SHA}"

      - name: Check if source already published
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # only skip on schedule; push/workflow_dispatch always build
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "skip=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          SRC="${{ steps.fingerprint.outputs.source_sha }}"
          OWNER="${{ github.repository_owner }}"
          COMP="${{ matrix.component }}"
          TAG="src-${SRC}"

          # Ask the GHCR registry directly for the tag list — robust to whether
          # the package owner is a user or an org (the packages REST API needs
          # /users vs /orgs and correct scopes).
          TOKEN=$(curl -fsSL -u "${GITHUB_ACTOR}:${GH_TOKEN}" \
            "https://ghcr.io/token?service=ghcr.io&scope=repository:${OWNER}/${COMP}:pull" \
            2>/dev/null | jq -r .token 2>/dev/null || true)

          EXISTS=""
          if [ -n "$TOKEN" ] && [ "$TOKEN" != "null" ]; then
            EXISTS=$(curl -fsSL -H "Authorization: Bearer ${TOKEN}" \
              "https://ghcr.io/v2/${OWNER}/${COMP}/tags/list" 2>/dev/null \
              | jq -r '.tags[]?' 2>/dev/null | grep -Fx "${TAG}" || true)
          fi

          if [ -n "$EXISTS" ]; then
            echo "Source ${SRC} already published as ${COMP}:${TAG}, skipping."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "Source ${SRC} not published for ${COMP}, building..."
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up QEMU
        if: steps.check.outputs.skip != 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.check.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        if: steps.check.outputs.skip != 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        if: steps.check.outputs.skip != 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.component }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.version.outputs.nodeget_version }}
            type=raw,value=src-${{ steps.fingerprint.outputs.source_sha }}

      - name: Build and push
        if: steps.check.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: docker/nodeget
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          build-args: |
            NODEGET_VERSION=${{ steps.version.outputs.nodeget_version }}
            NODEGET_REPO=${{ steps.version.outputs.nodeget_repo }}
            NODEGET_COMPONENT=${{ matrix.component }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.nodeget.source-sha=${{ steps.fingerprint.outputs.source_sha }}
          tags: ${{ steps.meta.outputs.tags }}
          push: true
          provenance: false
