name: Build Alpine Cloud Image

on:
  push:
    tags:
      - 'v*'
  schedule:
    - cron: '53 3 1 * *'
  workflow_dispatch:
    inputs:
      alpine_version_full:
        description: 'Alpine full version override (e.g. 3.24.1). Leave empty to use the latest stable release.'
        type: string
        default: ''
      alpine_release_rev:
        description: 'Alpine release revision override (e.g. r0). Leave empty to use the latest revision.'
        type: string
        default: ''
      debug:
        description: 'Verbose libguestfs tracing (LIBGUESTFS_DEBUG/TRACE)'
        type: boolean
        default: false

# Image builds share one monthly tag; never run two of them at once.
concurrency:
  group: alpine-cloud-image
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libguestfs-tools qemu-utils qemu-system-x86

      - name: Download latest Alpine cloud image
        env:
          ALPINE_VERSION_OVERRIDE: ${{ inputs.alpine_version_full }}
          ALPINE_REV_OVERRIDE: ${{ inputs.alpine_release_rev }}
        run: |
          set -euxo pipefail

          BASE_URL="https://dl-cdn.alpinelinux.org/alpine/latest-stable/releases/cloud"

          # version/revision come from latest-stable unless explicitly overridden
          if [ -n "${ALPINE_VERSION_OVERRIDE}" ]; then
            VERSION_RE="${ALPINE_VERSION_OVERRIDE}"
          else
            VERSION_RE='[0-9]+\.[0-9]+\.[0-9]+'
          fi

          if [ -n "${ALPINE_REV_OVERRIDE}" ]; then
            REV_RE="${ALPINE_REV_OVERRIDE}"
          else
            REV_RE='r[0-9]+'
          fi

          # Upstream renamed the cloud images with 3.24.2:
          #   <= 3.24.1: generic_alpine-<ver>-x86_64-uefi-cloudinit-rN.qcow2  (bios/uefi split)
          #   >= 3.24.2: alpine-<ver>-x86_64-cloudinit-rN.qcow2              (limine, hybrid BIOS+UEFI)
          # Match both schemes, skip the -metal-/-tiny- variants, and pick the highest
          # version. The sort key is the extracted version because a plain `sort -V`
          # ranks "generic_alpine-3.24.1..." above "alpine-3.24.2...".
          # NB: VERSION_RE/REV_RE are inserted into the name pattern, and REV_RE
          # already carries its own leading "r" (e.g. r0). The trailing `|| true`
          # matters: grep exits 1 when nothing matches and pipefail would abort the
          # step before the "no match" diagnostic below could run.
          curl -fsSL -o listing.html "${BASE_URL}/"
          NAME_RE="(generic_)?alpine-${VERSION_RE}-x86_64-([a-z0-9]+-)?cloudinit-${REV_RE}\.qcow2"

          FILE_NAME="$(grep -Eo "${NAME_RE}\"" listing.html \
            | tr -d '"' \
            | grep -vE -- '-metal-|-tiny-' \
            | sort -u \
            | sed -E 's/.*-([0-9]+\.[0-9]+\.[0-9]+)-x86_64-.*-r([0-9]+)\.qcow2/\1 \2 &/' \
            | sort -k1,1V -k2,2V \
            | tail -n1 \
            | cut -d' ' -f3- || true)"

          case "${FILE_NAME}" in
            *.qcow2) ;;
            *)
              echo "ERROR: no cloud image matched ${NAME_RE}" >&2
              echo "candidates currently published in ${BASE_URL}:" >&2
              grep -Eo 'href="[^"]*x86_64[^"]*\.qcow2"' listing.html | sort -u >&2
              exit 1
              ;;
          esac

          DOWNLOAD_URL="${BASE_URL}/${FILE_NAME}"
          echo "Image: ${FILE_NAME}"
          echo "URL: ${DOWNLOAD_URL}"

          wget -q --show-progress -O alpine-base.qcow2 "${DOWNLOAD_URL}"
          wget -q --show-progress -O alpine-base.qcow2.sha512 "${DOWNLOAD_URL}.sha512"

          # upstream publishes a bare hash next to each image (no filename column)
          EXPECTED_SHA512="$(tr -d '[:space:]' < alpine-base.qcow2.sha512)"
          ACTUAL_SHA512="$(sha512sum alpine-base.qcow2 | awk '{print $1}')"
          echo "expected sha512: ${EXPECTED_SHA512}"
          echo "actual   sha512: ${ACTUAL_SHA512}"
          if [ "${EXPECTED_SHA512}" != "${ACTUAL_SHA512}" ]; then
            echo "ERROR: sha512 mismatch for ${FILE_NAME}" >&2
            exit 1
          fi

          # extract actual Alpine version (e.g. 3.24.1 from generic_alpine-3.24.1-...)
          ALPINE_REAL_VER="$(echo "${FILE_NAME}" | grep -Eo '[0-9]+\.[0-9]+\.[0-9]+' | head -1 || true)"
          test -n "${ALPINE_REAL_VER}" || { echo "ERROR: cannot parse a version out of ${FILE_NAME}" >&2; exit 1; }
          ALPINE_REAL_MAJOR="v$(echo "${ALPINE_REAL_VER}" | cut -d. -f1,2)"
          echo "Resolved Alpine: ${ALPINE_REAL_MAJOR} (${ALPINE_REAL_VER})"

          if [ -n "${ALPINE_VERSION_OVERRIDE}${ALPINE_REV_OVERRIDE}" ]; then
            ALPINE_SOURCE="pinned"
          else
            ALPINE_SOURCE="latest stable"
          fi

          # export resolved values so later steps and release notes always match the image
          {
            echo "ALPINE_FILE=${FILE_NAME}"
            echo "ALPINE_VERSION_FULL=${ALPINE_REAL_VER}"
            echo "ALPINE_VERSION_MAJOR=${ALPINE_REAL_MAJOR}"
            echo "ALPINE_SOURCE=${ALPINE_SOURCE}"
          } >> "$GITHUB_ENV"

      - name: Validate downloaded image
        run: |
          set -euxo pipefail

          file alpine-base.qcow2
          test -f alpine-base.qcow2 || (echo "ERROR: alpine-base.qcow2 does not exist"; exit 1)
          test -s alpine-base.qcow2 || (echo "ERROR: alpine-base.qcow2 is empty"; exit 1)

          qemu-img info alpine-base.qcow2 > qemu-img-info.txt 2>&1
          if grep -q "file format: qcow2" qemu-img-info.txt && grep -q "virtual size" qemu-img-info.txt; then
            echo "Validation passed: valid qcow2 image"
            cat qemu-img-info.txt
          else
            echo "ERROR: qemu-img cannot recognize valid qcow2"
            cat qemu-img-info.txt
            exit 1
          fi

      - name: Resize image to 1G
        run: |
          set -euxo pipefail

          # The published images ship a small virtual disk (3.24.2: ~265 MiB), so
          # this normally grows the disk; the root partition is expanded on first
          # boot by cloud-init's growpart, with the growroot service as fallback.
          # The guard exists so a future, larger base image can never be shrunk.
          TARGET_BYTES=1073741824
          CURRENT_BYTES="$(qemu-img info alpine-base.qcow2 | sed -n 's/.*(\([0-9][0-9]*\) bytes).*/\1/p' | head -n1)"
          test -n "${CURRENT_BYTES}" || { echo "ERROR: cannot read the virtual size of alpine-base.qcow2" >&2; exit 1; }
          echo "current virtual size: ${CURRENT_BYTES} bytes, target: ${TARGET_BYTES} bytes"
          if [ "${CURRENT_BYTES}" -lt "${TARGET_BYTES}" ]; then
            sudo qemu-img resize alpine-base.qcow2 1G
          else
            echo "image is already at least 1G, leaving it alone"
          fi
          qemu-img info alpine-base.qcow2

      - name: Prepare guest customization files
        run: |
          set -euxo pipefail
          mkdir -p guest

          cat > guest/chrony.conf <<'EOF'
          pool ntp.aliyun.com iburst
          driftfile /var/lib/chrony/drift
          rtcsync
          makestep 1.0 3
          logdir /var/log/chrony
          EOF

          cat > guest/99-growpart.cfg <<'EOF'
          # grow the root partition/filesystem to fill the disk on first boot
          growpart:
            mode: auto
            devices: ["/"]
            ignore_growroot_disabled: false
          resize_rootfs: true
          EOF

          cat > guest/99-alicloud.cfg <<'EOF'
          # never ship SSH host keys baked into the image; regenerate per instance
          ssh_deletekeys: true
          ssh_genkeytypes: [ed25519, rsa]
          EOF

          cat > guest/99-bbr.conf <<'EOF'
          net.core.default_qdisc = fq
          net.ipv4.tcp_congestion_control = bbr
          EOF

          # NB: no net.ipv4.udp_mem override. Pinning it to 32/64/128 MiB caps UDP
          # memory below the kernel-scaled default on any instance with more than
          # ~1 GiB RAM, which contradicts the raised udp_rmem_min/udp_wmem_min below.
          cat > guest/99-universal-net.conf <<'EOF'
          # universal-optimize: safe network tuning
          net.core.rmem_default = 4194304
          net.core.wmem_default = 4194304
          net.core.optmem_max = 8388608
          net.core.netdev_max_backlog = 50000
          net.core.somaxconn = 16384
          net.ipv4.ip_local_port_range = 10240 65535
          net.ipv4.udp_rmem_min = 131072
          net.ipv4.udp_wmem_min = 131072
          EOF

          # Alpine's default openssh-server is built --without-pam, so
          # /etc/security/limits.d is ignored for SSH sessions. The PAM flavour
          # (openssh-server-pam + UsePAM yes) is what makes these limits apply.
          cat > guest/99-universal.conf <<'EOF'
          * soft nofile 1048576
          * hard nofile 1048576
          * soft nproc unlimited
          * hard nproc unlimited
          EOF

          echo tcp_bbr > guest/bbr.modules

          # The modules and sysctl OpenRC services declare no ordering between
          # them, so re-assert BBR once the boot runlevel is done.
          cat > guest/bbr.start <<'EOF'
          #!/bin/sh
          # Re-assert BBR after boot: modules-load and sysctl have no declared
          # ordering, so a sysctl write can race the tcp_bbr module load.
          modprobe tcp_bbr 2>/dev/null || true
          sysctl -q -w net.core.default_qdisc=fq 2>/dev/null || true
          sysctl -q -w net.ipv4.tcp_congestion_control=bbr 2>/dev/null || true
          EOF

          cat > guest/growroot <<'EOF'
          #!/sbin/openrc-run
          # Fallback for growing the root partition/filesystem, for the case where
          # cloud-init's growpart module never runs (broken metadata service,
          # cloud-init disabled, ...). It lives in the boot runlevel, which OpenRC
          # completes before starting the default runlevel, so it cannot touch the
          # partition table at the same time as cloud-init's own growpart; that one
          # then simply finds nothing left to grow.

          description="Grow root partition and filesystem to fill the disk"

          depend() {
          	after localmount
          	before net
          }

          start() {
          	local rootdev disk part fstype

          	rootdev="$(awk '$2 == "/" { print $1; exit }' /proc/mounts)"
          	if [ ! -b "$rootdev" ]; then
          		ewarn "growroot: cannot determine root device (${rootdev:-none}), skipping"
          		return 0
          	fi

          	case "$rootdev" in
          		/dev/nvme*n*p[0-9]*) disk="${rootdev%p*}"; part="${rootdev##*p}" ;;
          		/dev/mmcblk*p[0-9]*) disk="${rootdev%p*}"; part="${rootdev##*p}" ;;
          		/dev/*[0-9])         disk="${rootdev%[0-9]}"; part="${rootdev##*[!0-9]}" ;;
          		*) ewarn "growroot: unsupported root device $rootdev, skipping"; return 0 ;;
          	esac

          	if command -v growpart >/dev/null 2>&1; then
          		ebegin "Growing root partition ${disk} ${part}"
          		growpart "$disk" "$part" || true
          		eend 0
          	else
          		ewarn "growroot: growpart not found, skipping partition resize"
          	fi

          	fstype="$(awk '$2 == "/" { print $3; exit }' /proc/mounts)"
          	case "$fstype" in
          		ext2|ext3|ext4)
          			if command -v resize2fs >/dev/null 2>&1; then
          				ebegin "Growing root filesystem"
          				resize2fs "$rootdev" >/dev/null 2>&1 || true
          				eend 0
          			else
          				ewarn "growroot: resize2fs not found (install e2fsprogs-extra)"
          			fi
          			;;
          		*) ewarn "growroot: filesystem ${fstype:-unknown} is not grown online, skipping" ;;
          	esac

          	# best effort only - never block boot on this
          	return 0
          }
          EOF

          cat > guest/patch-cmdline.sh <<'EOF'
          #!/bin/sh
          # Append the Alibaba Cloud kernel cmdline options to whichever
          # bootloader configuration this image uses. Alpine switched firmware
          # between 3.24.1 and 3.24.2 (syslinux/grub split -> limine), and
          # virt-customize discards guest stdout, so the outcome is written to a
          # report that the workflow reads back with virt-cat.

          CMDLINE="net.ifnames=0 console=tty0 console=ttyS0,115200n8"
          # overridable for offline testing of this script
          BOOT_DIR="${BOOT_DIR:-/boot}"
          REPORT="${REPORT:-/var/log/image-build/boot-cmdline.txt}"
          mkdir -p "$(dirname "$REPORT")"

          {
          	echo "== bootloader discovery =="
          	ls -l "$BOOT_DIR" 2>/dev/null
          	ls -l "$BOOT_DIR"/limine* "$BOOT_DIR"/*.cfg "$BOOT_DIR"/*.conf 2>/dev/null
          } > "$REPORT"

          found=0
          patched=0
          CANDIDATES=/tmp/img-candidates.txt

          # Fixed locations plus everything under the boot directory that looks
          # like a bootloader config, so a renamed/moved configuration (limine
          # replaced the syslinux/grub split in Alpine 3.24.2) is still found.
          {
          	printf '%s\n' \
          		"$BOOT_DIR/extlinux.conf" \
          		"$BOOT_DIR/grub/grub.cfg" \
          		"$BOOT_DIR/limine.cfg" \
          		"$BOOT_DIR/limine.conf" \
          		"$BOOT_DIR/limine/limine.cfg" \
          		"$BOOT_DIR/limine/limine.conf" \
          		"$BOOT_DIR/efi/limine.cfg" \
          		"$BOOT_DIR/efi/limine.conf"
          	find "$BOOT_DIR" -maxdepth 4 -type f \( -name '*.cfg' -o -name '*.conf' \) 2>/dev/null
          } | sort -u > "$CANDIDATES"

          while IFS= read -r f; do
          	[ -f "$f" ] || continue
          	found=$((found + 1))
          	echo "== candidate: $f ==" >> "$REPORT"
          	cp -f "$f" "$(dirname "$REPORT")/$(basename "$f").orig" 2>/dev/null || true

          	if grep -qE '^[[:space:]]*APPEND[[:space:]]' "$f"; then
          		sed -i "s/^\([[:space:]]*APPEND[[:space:]].*\)$/\1 ${CMDLINE}/" "$f"
          		action="APPEND"
          	elif grep -qE '^[[:space:]]*(KERNEL_)?CMDLINE[[:space:]]*=' "$f"; then
          		# BRE interval, not the GNU-only \? extension
          		sed -i "s/^\([[:space:]]*\(KERNEL_\)\{0,1\}CMDLINE[[:space:]]*=.*\)$/\1 ${CMDLINE}/" "$f"
          		action="CMDLINE"
          	elif grep -qE '^[[:space:]]*linux[[:space:]]' "$f"; then
          		sed -i "s/^\([[:space:]]*linux[[:space:]].*\)$/\1 ${CMDLINE}/" "$f"
          		action="grub linux"
          	else
          		action=""
          	fi

          	# sed exits 0 even when nothing matched, so verify the edit landed
          	if [ -n "$action" ] && grep -qF -- "$CMDLINE" "$f"; then
          		patched=$((patched + 1))
          		echo "action: appended to $action" >> "$REPORT"
          	else
          		echo "action: FAILED - no recognised cmdline key, or the edit did not stick" >> "$REPORT"
          	fi

          	echo "--- $f (post-patch) ---" >> "$REPORT"
          	cat "$f" >> "$REPORT"
          done < "$CANDIDATES"
          rm -f "$CANDIDATES"

          echo "candidates=${found} patched=${patched}" >> "$REPORT"
          exit 0
          EOF

          cat > guest/verify.sh <<'EOF'
          #!/bin/sh
          # Post-build verification. virt-customize discards guest stdout, so every
          # result goes to /var/log/image-build/verify.txt; the workflow reads it
          # back and fails the build on any FAIL line.

          REPORT=/var/log/image-build/verify.txt
          mkdir -p /var/log/image-build
          : > "$REPORT"

          pass=0
          fail=0

          ok()  { pass=$((pass + 1)); echo "ok   $1" >> "$REPORT"; }
          bad() { fail=$((fail + 1)); echo "FAIL $1" >> "$REPORT"; }

          file_exists() { [ -f "$1" ] && ok "file $1" || bad "file $1 missing"; }
          exec_exists() { [ -x "$1" ] && ok "exec $1" || bad "exec $1 missing or not executable"; }
          syntax_ok()   { sh -n "$1" 2>/dev/null && ok "syntax $1" || bad "syntax $1"; }
          runlevel_on() { [ -e "/etc/runlevels/$1/$2" ] && ok "runlevel $1/$2" || bad "runlevel $1/$2 not enabled"; }
          file_match()  { grep -qE "$2" "$1" 2>/dev/null && ok "$1 ~ $2" || bad "$1 does not match $2"; }
          file_absent() { ls $1 >/dev/null 2>&1 && bad "unexpected files: $1" || ok "no files matching $1"; }

          echo "== apk repositories ==" >> "$REPORT"
          file_match /etc/apk/repositories 'mirrors\.aliyun\.com/alpine'
          file_match /etc/apk/repositories '/alpine/latest-stable'
          grep -q 'dl-cdn\.alpinelinux\.org' /etc/apk/repositories \
          	&& bad "/etc/apk/repositories still points at dl-cdn" \
          	|| ok "/etc/apk/repositories has no dl-cdn entry"

          echo "== base configuration ==" >> "$REPORT"
          file_match /etc/chrony/chrony.conf 'pool ntp\.aliyun\.com iburst'
          file_match /etc/cloud/cloud.cfg.d/99-growpart.cfg 'resize_rootfs: true'
          file_match /etc/cloud/cloud.cfg.d/99-alicloud.cfg 'ssh_deletekeys: true'
          file_match /etc/sysctl.d/99-bbr.conf 'net\.ipv4\.tcp_congestion_control = bbr'
          file_match /etc/modules-load.d/bbr.conf '^tcp_bbr$'
          file_match /etc/sysctl.d/99-universal-net.conf 'net\.core\.somaxconn = 16384'
          file_match /etc/security/limits.d/99-universal.conf 'nofile 1048576'

          echo "== sshd ==" >> "$REPORT"
          file_match /etc/ssh/sshd_config '^PermitRootLogin yes'
          file_match /etc/ssh/sshd_config '^PasswordAuthentication no'
          file_match /etc/ssh/sshd_config '^KbdInteractiveAuthentication no'
          file_match /etc/ssh/sshd_config '^UsePAM yes'
          file_match /etc/ssh/sshd_config '^UseDNS no'
          file_exists /usr/sbin/sshd.pam
          file_exists /etc/pam.d/sshd
          file_match /etc/pam.d/sshd 'pam_limits'
          ls /usr/lib/security/pam_limits.so /lib/security/pam_limits.so \
          	/usr/lib/*/security/pam_limits.so >/dev/null 2>&1 \
          	&& ok "pam_limits.so present" \
          	|| bad "pam_limits.so not found"

          # The PAM sshd must accept the config we wrote; sshd -t needs host keys,
          # so generate throwaway ones and remove them again (the image must ship
          # without host keys - asserted in the hygiene section below).
          if ssh-keygen -A >/dev/null 2>&1 && /usr/sbin/sshd.pam -t >/dev/null 2>&1; then
          	ok "sshd.pam accepts /etc/ssh/sshd_config"
          else
          	bad "sshd.pam rejects /etc/ssh/sshd_config"
          	{
          		echo "--- ssh-keygen -A output ---"; ssh-keygen -A 2>&1
          		echo "--- sshd.pam -t output ---"; /usr/sbin/sshd.pam -t 2>&1
          	} >> "$REPORT"
          fi
          rm -f /etc/ssh/ssh_host_*

          echo "== services ==" >> "$REPORT"
          for s in sshd chronyd cloud-init cloud-init-local cloud-config cloud-final local; do
          	runlevel_on default "$s"
          done
          runlevel_on boot growroot
          exec_exists /etc/init.d/growroot
          exec_exists /etc/local.d/bbr.start
          syntax_ok /etc/init.d/growroot
          syntax_ok /etc/local.d/bbr.start

          echo "== image hygiene ==" >> "$REPORT"
          if [ -s /etc/machine-id ]; then bad "machine-id is not empty"; else ok "machine-id is empty"; fi
          file_absent '/etc/ssh/ssh_host_*'
          file_absent '/tmp/img-*'

          echo "== boot cmdline ==" >> "$REPORT"
          if grep -q 'patched=[1-9]' /var/log/image-build/boot-cmdline.txt 2>/dev/null; then
          	ok "kernel cmdline patched"
          else
          	bad "kernel cmdline not patched (see boot-cmdline.txt)"
          fi

          echo "---- ${pass} ok, ${fail} FAIL ----" >> "$REPORT"
          exit 0
          EOF

          chmod 0755 guest/growroot guest/bbr.start guest/patch-cmdline.sh guest/verify.sh

          # fail fast on shell syntax errors before burning an image build
          for s in guest/growroot guest/bbr.start guest/patch-cmdline.sh guest/verify.sh; do
            sh -n "$s"
          done

      - name: Customize for Alibaba Cloud ECS
        env:
          VIRT_DEBUG: ${{ inputs.debug && '-v -x' || '' }}
        run: |
          set -euxo pipefail

          # Only package installation and staging happen here. Uploads land in /tmp
          # (which always exists) and are moved into place by the next step, because
          # virt-customize documents no ordering between different option types:
          # --install may run before or after --upload/--run-command, and --upload
          # requires its target directory to exist already.
          # LIBGUESTFS_BACKEND is passed on the sudo command line: sudo resets the
          # environment, so an exported variable would never reach virt-customize.
          sudo LIBGUESTFS_BACKEND=direct virt-customize ${VIRT_DEBUG} -a alpine-base.qcow2 \
            --smp 2 \
            --timezone Asia/Hong_Kong \
            --install sudo,chrony,cloud-init,cloud-utils-growpart,openssh-server-pam,e2fsprogs-extra \
            --upload guest/chrony.conf:/tmp/img-chrony.conf \
            --upload guest/99-growpart.cfg:/tmp/img-99-growpart.cfg \
            --upload guest/99-alicloud.cfg:/tmp/img-99-alicloud.cfg \
            --upload guest/99-bbr.conf:/tmp/img-99-bbr.conf \
            --upload guest/99-universal-net.conf:/tmp/img-99-universal-net.conf \
            --upload guest/99-universal.conf:/tmp/img-99-universal.conf \
            --upload guest/bbr.modules:/tmp/img-bbr.modules \
            --upload guest/bbr.start:/tmp/img-bbr.start \
            --upload guest/growroot:/tmp/img-growroot \
            --upload guest/patch-cmdline.sh:/tmp/img-patch-cmdline.sh \
            --upload guest/verify.sh:/tmp/img-verify.sh

      - name: Install guest files and configuration
        env:
          VIRT_DEBUG: ${{ inputs.debug && '-v -x' || '' }}
        run: |
          set -euxo pipefail

          # A separate run, so the packages (and with them /etc/pam.d/sshd and
          # /etc/chrony) are guaranteed to be installed before anything touches
          # them: apk refuses to overwrite unmanaged files, so creating
          # /etc/pam.d/sshd before the package lands would abort the build.
          sudo LIBGUESTFS_BACKEND=direct virt-customize ${VIRT_DEBUG} -a alpine-base.qcow2 \
            --smp 2 \
            --run-command 'mkdir -p /etc/chrony /etc/cloud/cloud.cfg.d /etc/modules-load.d /etc/local.d /etc/security/limits.d /etc/sysctl.d /var/log/image-build' \
            --run-command 'cp -f /tmp/img-chrony.conf /etc/chrony/chrony.conf' \
            --run-command 'cp -f /tmp/img-99-growpart.cfg /etc/cloud/cloud.cfg.d/99-growpart.cfg' \
            --run-command 'cp -f /tmp/img-99-alicloud.cfg /etc/cloud/cloud.cfg.d/99-alicloud.cfg' \
            --run-command 'cp -f /tmp/img-99-bbr.conf /etc/sysctl.d/99-bbr.conf' \
            --run-command 'cp -f /tmp/img-99-universal-net.conf /etc/sysctl.d/99-universal-net.conf' \
            --run-command 'cp -f /tmp/img-99-universal.conf /etc/security/limits.d/99-universal.conf' \
            --run-command 'cp -f /tmp/img-bbr.modules /etc/modules-load.d/bbr.conf' \
            --run-command 'cp -f /tmp/img-bbr.start /etc/local.d/bbr.start' \
            --run-command 'cp -f /tmp/img-growroot /etc/init.d/growroot' \
            --run-command 'cp -f /tmp/img-patch-cmdline.sh /var/log/image-build/patch-cmdline.sh' \
            --run-command 'cp -f /tmp/img-verify.sh /var/log/image-build/verify.sh' \
            --run-command 'chmod 0755 /etc/init.d/growroot /etc/local.d/bbr.start /var/log/image-build/patch-cmdline.sh /var/log/image-build/verify.sh' \
            --run-command "sed -i 's/#*PermitRootLogin.*/PermitRootLogin yes/g' /etc/ssh/sshd_config" \
            --run-command "sed -i 's/#*PasswordAuthentication.*/PasswordAuthentication no/g' /etc/ssh/sshd_config" \
            --run-command "sed -i 's/#*KbdInteractiveAuthentication.*/KbdInteractiveAuthentication no/g' /etc/ssh/sshd_config; grep -qE '^KbdInteractiveAuthentication[[:space:]]+no' /etc/ssh/sshd_config || echo 'KbdInteractiveAuthentication no' >> /etc/ssh/sshd_config" \
            --run-command "sed -i 's/#*UsePAM.*/UsePAM yes/g' /etc/ssh/sshd_config; grep -qE '^UsePAM[[:space:]]+yes' /etc/ssh/sshd_config || echo 'UsePAM yes' >> /etc/ssh/sshd_config" \
            --run-command "grep -q 'pam_limits' /etc/pam.d/sshd 2>/dev/null || printf '%s\n' 'session required pam_limits.so' >> /etc/pam.d/sshd" \
            --append-line '/etc/ssh/sshd_config:UseDNS no' \
            --run-command 'rm -f /etc/ssh/ssh_host_*' \
            --run-command 'apk cache clean || true' \
            --run-command "cp -f /etc/apk/repositories /etc/apk/repositories.bak" \
            --run-command "sed -Ei 's#https?://dl-cdn\.alpinelinux\.org/alpine#https://mirrors.aliyun.com/alpine#g' /etc/apk/repositories && sed -Ei 's#/alpine/v[0-9]+\.[0-9]+#/alpine/latest-stable#g' /etc/apk/repositories" \
            --run-command 'rm -rf /var/lib/cloud/* /var/cache/apk/* /var/log/*.log || true' \
            --run-command 'mkdir -p /etc && : > /etc/machine-id'

      - name: Enable services and verify image
        env:
          VIRT_DEBUG: ${{ inputs.debug && '-v -x' || '' }}
        run: |
          set -euxo pipefail

          # Service enabling is best-effort; its outcome is asserted by verify.sh,
          # which is the gate for the whole build.
          sudo LIBGUESTFS_BACKEND=direct virt-customize ${VIRT_DEBUG} -a alpine-base.qcow2 \
            --smp 2 \
            --run-command 'sh /var/log/image-build/patch-cmdline.sh' \
            --run-command 'rc-update add local default || true' \
            --run-command 'rc-update add growroot boot || true' \
            --run-command 'rc-update add chronyd default || true' \
            --run-command 'rc-update add sshd default || true' \
            --run-command 'rc-update add cloud-init default || true' \
            --run-command 'rc-update add cloud-config default || true' \
            --run-command 'rc-update add cloud-final default || true' \
            --run-command 'rc-update add cloud-init-local default || true' \
            --run-command 'rm -f /tmp/img-*' \
            --run-command 'sh /var/log/image-build/verify.sh'

      - name: Collect build reports
        run: |
          set -uo pipefail

          for f in boot-cmdline.txt verify.txt; do
            sudo virt-cat -a alpine-base.qcow2 "/var/log/image-build/${f}" > "${f}" 2>/dev/null || true
          done

          echo "=== bootloader / kernel cmdline report ==="
          cat boot-cmdline.txt
          echo "=== image verification report ==="
          cat verify.txt
          echo "=== filesystems ==="
          sudo virt-filesystems -a alpine-base.qcow2 --all --long -h || true

          if [ ! -s verify.txt ]; then
            echo "::error::verification report is empty - the in-guest checks did not run"
            exit 1
          fi
          if grep -q '^FAIL' verify.txt; then
            echo "::error::image verification failed:"
            grep '^FAIL' verify.txt
            exit 1
          fi

      - name: Compress image
        run: |
          set -euxo pipefail

          if sudo LIBGUESTFS_BACKEND=direct virt-sparsify --compress alpine-base.qcow2 alpine-custom.qcow2; then
            echo "virt-sparsify success"
          else
            echo "virt-sparsify failed, fallback to qemu-img convert"
            rm -f alpine-custom.qcow2
            qemu-img convert -O qcow2 -c alpine-base.qcow2 alpine-custom.qcow2
          fi

          qemu-img info alpine-custom.qcow2
          ls -lh alpine-custom.qcow2
          sha256sum alpine-custom.qcow2 > alpine-custom.qcow2.sha256
          cat alpine-custom.qcow2.sha256

      # Advisory only: proves the shipped image boots and that sshd, PAM limits,
      # BBR and the root-filesystem resize behave on a real boot. Never gates the
      # release, so a slow/flaky runner cannot block the monthly image.
      - name: Boot smoke test
        continue-on-error: true
        run: |
          set -uxo pipefail

          if [ ! -e /dev/kvm ]; then
            echo "::warning::no /dev/kvm on this runner, skipping boot smoke test"
            exit 0
          fi

          ssh-keygen -q -t ed25519 -N '' -f smoke_key
          cp alpine-custom.qcow2 smoke.qcow2
          # the tested copy gets a throwaway key; the released image stays clean
          if ! sudo LIBGUESTFS_BACKEND=direct virt-customize -a smoke.qcow2 --ssh-inject "root:file:smoke_key.pub"; then
            echo "::warning::boot smoke test: could not inject a test key, skipping"
            exit 0
          fi

          qemu-system-x86_64 \
            -machine q35,accel=kvm -cpu host -m 1024 -smp 2 \
            -drive file=smoke.qcow2,if=virtio,format=qcow2 \
            -netdev user,id=n0,hostfwd=tcp::2222-:22 \
            -device virtio-net-pci,netdev=n0 \
            -display none -monitor none -serial file:boot.log &
          QEMU_PID=$!
          # one cleanup path for every exit below; the guest stays up until the
          # probes have actually run
          trap 'kill "${QEMU_PID}" 2>/dev/null || true' EXIT

          SSH_OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=5 -o BatchMode=yes -i smoke_key -p 2222"

          up=0
          for i in $(seq 1 60); do
            if ssh ${SSH_OPTS} root@127.0.0.1 true 2>/dev/null; then up=1; break; fi
            sleep 5
          done

          if [ "${up}" != 1 ]; then
            echo "::warning::boot smoke test: could not log in within 300s"
            echo "=== serial console (tail) ==="
            tail -n 40 boot.log || true
            exit 0
          fi

          echo "=== runtime state on the booted image ==="
          if ! ssh ${SSH_OPTS} root@127.0.0.1 '
            echo "kernel=$(uname -r)"
            echo "rootfs=$(df -k / | tail -n1)"
            echo "nofile=$(ulimit -n)"
            echo "qdisc=$(sysctl -n net.core.default_qdisc 2>&1)"
            echo "congestion=$(sysctl -n net.ipv4.tcp_congestion_control 2>&1)"
            echo "links=$(ip -brief link 2>&1 | tr "\n" " ")"
            echo "cloud_init=$(cloud-init status 2>&1 | head -n1)"
            echo "rc_default=$(rc-status default 2>&1 | tr "\n" " ")"
          ' 2>&1 | tee runtime-state.txt; then
            echo "::warning::boot smoke test: login worked but the runtime probe failed"
            exit 0
          fi

          echo "=== smoke verdicts (advisory) ==="
          grep -q '^congestion=bbr$' runtime-state.txt \
            && echo "ok   tcp_congestion_control=bbr" \
            || echo "::warning::smoke: BBR is not active"
          grep -qE '^nofile=[0-9]{6,}$' runtime-state.txt \
            && echo "ok   SSH nofile limit applied" \
            || echo "::warning::smoke: SSH nofile limit not applied"
          grep -qE '^links=[^;]*eth0' runtime-state.txt \
            && echo "ok   NIC is named eth0" \
            || echo "::warning::smoke: NIC is not named eth0"
          grep -q '^cloud_init=status: done' runtime-state.txt \
            && echo "ok   cloud-init reported done" \
            || echo "note cloud-init did not report done (expected without a metadata service)"
          ROOTFS_KB="$(sed -n 's/^rootfs=[^ ]*[[:space:]]*\([0-9][0-9]*\).*/\1/p' runtime-state.txt | head -n1)"
          if [ -n "${ROOTFS_KB}" ] && [ "${ROOTFS_KB}" -gt 900000 ]; then
            echo "ok   root filesystem grew to ${ROOTFS_KB} KiB"
          else
            echo "::warning::smoke: root filesystem did not grow (${ROOTFS_KB:-unknown} KiB)"
          fi
          echo "BOOT SMOKE: login and probes completed"

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail

          # Image releases live in their own tag namespace so they can never
          # clobber (or be clobbered by) the code releases from release.yml.
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            TAG_NAME="alpine-cloud-${GITHUB_REF_NAME}"
          elif [ "${GITHUB_EVENT_NAME}" = "schedule" ]; then
            TAG_NAME="alpine-cloud-monthly-$(date -u +%Y%m)"
          else
            TAG_NAME="alpine-cloud-manual-$(date -u +%Y%m%dT%H%M%SZ)"
          fi

          IMAGE_SHA256="$(awk '{print $1}' alpine-custom.qcow2.sha256)"
          IMAGE_SIZE="$(du -h alpine-custom.qcow2 | awk '{print $1}')"
          echo "Release tag: ${TAG_NAME}"
          ls -lh alpine-custom.qcow2

          NOTES="$(printf '%s\n' \
            'Custom Alpine Linux image optimized for Alibaba Cloud ECS.' \
            '' \
            "- Base image: \`${ALPINE_FILE}\`" \
            "- Alpine: ${ALPINE_VERSION_FULL} (${ALPINE_SOURCE})" \
            "- Image: \`alpine-custom.qcow2\` (${IMAGE_SIZE})" \
            "- SHA256: \`${IMAGE_SHA256}\`" \
            '' \
            'Includes cloud-init + growpart, BBR (fq), Aliyun NTP and apk mirror, key-only root SSH, raised nofile/nproc limits.')"

          if ! gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release create "$TAG_NAME" \
              --target "${GITHUB_SHA}" \
              --title "Custom Alpine Linux Cloud Image ${TAG_NAME}" \
              --notes "$NOTES"
          fi

          upload_ok=0
          for attempt in 1 2 3; do
            if gh release upload "$TAG_NAME" alpine-custom.qcow2 alpine-custom.qcow2.sha256 --clobber; then
              upload_ok=1
              break
            fi
            echo "upload attempt ${attempt} failed, retrying in 15s" >&2
            sleep 15
          done
          if [ "${upload_ok}" != 1 ]; then
            echo "ERROR: release upload failed after 3 attempts" >&2
            exit 1
          fi

          gh release edit "$TAG_NAME" --latest --notes "$NOTES"
