name: WARP Reachability Test

on:
  workflow_dispatch:

jobs:
  warp:
    runs-on: ubuntu-latest
    steps:
      - name: Install deps
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq wireguard-tools curl jq netcat-openbsd
          TAG=$(curl -fsSL https://api.github.com/repos/ViRb3/wgcf/releases/latest | jq -r .tag_name)
          VER=${TAG#v}
          sudo curl -fsSL -o /usr/local/bin/wgcf "https://github.com/ViRb3/wgcf/releases/download/${TAG}/wgcf_${VER}_linux_amd64"
          sudo chmod +x /usr/local/bin/wgcf
          wgcf help > /dev/null

      - name: Register WARP + bring up WireGuard
        run: |
          set -euo pipefail
          wgcf register --accept-tos
          wgcf generate
          echo "::group::wgcf-profile"
          cat wgcf-profile.conf
          echo "::endgroup::"
          sudo install -m 600 wgcf-profile.conf /etc/wireguard/wg0.conf
          sudo wg-quick up wg0 || echo "wg-quick up failed: $?"
          sudo wg show || true

      - name: Probe through WARP
        run: |
          set -uo pipefail
          for i in 1 2 3 4; do
            echo "--- attempt $i ---"
            curl -s --max-time 10 https://www.cloudflare.com/cdn-cgi/trace | grep -E '^(ip|warp|loc|colo)=' || echo "trace failed"
            sudo wg show wg0 latest-handshakes || true
            sleep 3
          done

      - name: Raw UDP reachability to endpoint
        run: |
          set -uo pipefail
          for ep in 162.159.192.1:2408 162.159.204.1:2408 162.159.193.1:2408; do
            host=${ep%:*}; port=${ep#*:}
            timeout 6 nc -zu $host $port && echo "$ep reachable-ish" || echo "$ep udp nc exit=$?"
          done
          echo "--- TCP 443 to speed IPs ---"
          for ip in 104.26.4.90 162.159.136.89 162.159.58.65; do
            curl -o /dev/null -sS -m 8 -w "$ip http=%{http_code} connect=%{time_connect}s\n" --resolve "cloudflare.com:443:$ip" https://cloudflare.com/ || echo "$ip fail"
          done

      - name: Cleanup
        if: always()
        run: sudo wg-quick down wg0 || true
