services:
  aimili-vpngate:
    image: ghcr.io/viogus/aimili-vpngate:latest
    restart: unless-stopped
    # container stdout is a second copy of vpngate.log — keep it bounded too
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "8787:8787"   # web panel
      - "7928:7928"   # SOCKS5/HTTP proxy
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv4.conf.all.rp_filter=2
      - net.ipv4.conf.default.rp_filter=2
    volumes:
      - aimili-data:/opt/aimilivpn/vpngate_data
    environment:
      - WEB_PORT=8787
      # - WEB_USERNAME=admin
      # - WEB_PASSWORD=your_password
      # - SECRET_PATH=mysecret
      # - LOCAL_PROXY_USER=proxy_user      # SOCKS5/HTTP 代理认证
      # - LOCAL_PROXY_PASS=proxy_pass      # 设置后代理需用户名密码
      # 只在这个国家内选最优连接：ISO 两字母代码，或用面板里的国家名（日本/Japan），
      # 多个用逗号分隔；单国时同时锁定路由模式为「固定地区」（只连该国节点）。
      # - VPNGATE_COUNTRY=JP
      # - VPNGATE_COUNTRY_LOCK=0           # 设为 0 只收窄候选池，失效可回退到其他国家
      # - VPNGATE_LOG_MAX_BYTES=16777216   # vpngate.log 单文件上限（字节），0 = 不轮转
      # - VPNGATE_LOG_BACKUP_COUNT=3       # 保留的 vpngate.log.N 历史份数

volumes:
  aimili-data:
