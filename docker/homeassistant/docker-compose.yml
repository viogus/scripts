services:
  homeassistant:
    # nano = 只留小米 + HomeKit + BLE 用得到的集成（261 MB）；换 full/slim/micro 改这一行
    image: ghcr.io/viogus/homeassistant:2026.10.4-nano
    container_name: homeassistant
    restart: unless-stopped
    # HA 的自动发现（mDNS / SSDP / 局域网广播）需要 host 网络。
    # 只在内网跑、不需要发现的场景可以换成 ports: ["8123:8123"]。
    network_mode: host
    volumes:
      - ./config:/config
      - /etc/localtime:/etc/localtime:ro
      # 蓝牙：容器里要通过 D-Bus 跟宿主的 bluetoothd 说话，BLE 温湿度计才看得见。
      # 不用蓝牙可以删掉这一行和下面的 cap_add。
      - /run/dbus:/run/dbus:ro
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      TZ: Asia/Shanghai
      # 镜像已预装 Xiaomi Home 集成，entrypoint 会在启动时把它补进
      # ./config/custom_components/（已存在则不动）。
      # 挂 /config（HA 惯例）或 /data 都行，entrypoint 会自动认，并把另一个软链过去。
      # 要强制指定配置目录：CONFIG_DIR=/config
      # 想以非 root 跑的话，把下面两行的注释去掉，并且先 chown -R 1000:1000 ./config
      # 注意：nmap 的 SYN 扫描、部分设备追踪需要 root，普通用户会退化
      # user: "1000:1000"
